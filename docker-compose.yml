# Homelab uptime monitor behind an Nginx reverse proxy.
# Uptime Kuma image and /app/data path follow the upstream Compose file:
# https://github.com/louislam/uptime-kuma/blob/master/compose.yaml

name: homelab-monitoring

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    # No host port. Reach the dashboard through Nginx on NGINX_HTTP_PORT.
    expose:
      - "3001"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - uptime-kuma-data:/app/data
    # Monitors can reach a service published on the Docker host at
    # host.docker.internal. Ports bound only to 127.0.0.1 stay unreachable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - uptime-kuma
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptime-kuma-data:
    name: homelab-monitoring-data
