upstream uptime_kuma {
  server uptime-kuma:3001;
  keepalive 8;
}

# Shared security headers for every response from this front door.
map $sent_http_content_type $csp {
  default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'";
}

server {
  listen 80;
  server_name _;

  # Hide nginx version on error pages too.
  server_tokens off;

  # Health endpoint: no auth, no rate limit, answered by nginx itself.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Everything else goes to Uptime Kuma behind basic auth and rate limits.
  location / {
    limit_req zone=dashboard burst=4 nodelay;
    limit_req_status 429;

    auth_basic "Homelab monitoring";
    auth_basic_user_file /etc/nginx/htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    proxy_pass http://uptime_kuma;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp always;
  }
}
