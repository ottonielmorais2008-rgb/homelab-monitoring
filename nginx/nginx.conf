worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Compress text responses from the proxy and static errors.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml;

  # Shared rate-limit zone for the dashboard front door.
  # 2 requests/second with a small burst; excess returns 429.
  limit_req_zone $binary_remote_addr zone=dashboard:10m rate=2r/s;

  include /etc/nginx/conf.d/*.conf;
}
